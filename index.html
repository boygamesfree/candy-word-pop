<title>Candy Word Pop – Free Food Word Typing Game | Typing Games Free</title>
<meta name="description" content="Candies with food words fall and stack up. Type each word to pop it before the pile reaches the top. A free word typing game from Typing Games Free.">

<style>
:root{--p1:#3b1b6e;--p2:#2a1252;--line:#8a5fd0;--org:#ffd166;--pink:#ff4f7b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px;background:#24103f;font-family:Fredoka,ui-rounded,"Trebuchet MS",system-ui,sans-serif}
@media(prefers-color-scheme:light){body{background:#f1e3ff}}
#stage{container-type:inline-size;position:relative;width:100%;max-width:860px;aspect-ratio:4/3;overflow:hidden;border-radius:18px;border:3px solid var(--p2);user-select:none;background:#8a4fd0}
canvas{position:absolute;inset:0;width:100%;height:100%}
.card{background:linear-gradient(var(--p1),var(--p2));border:.5cqw solid var(--line);border-radius:2.2cqw;color:#fff;box-shadow:0 .6cqw 0 rgba(0,0,0,.25)}
#hud{position:absolute;top:2cqw;left:2cqw;display:flex;gap:1.6cqw;align-items:stretch}
#hud .card{padding:1cqw 2.4cqw}
#hud small{display:block;font-size:1.6cqw;font-weight:700;letter-spacing:.1em;color:var(--org)}
#hud b{font-size:3.4cqw;line-height:1.1}
.tm{display:flex;align-items:center;gap:1.4cqw}
#ring{width:4.6cqw;height:4.6cqw;border-radius:50%;background:conic-gradient(var(--org) calc(var(--t,100) * 1%),#5b3a9a 0);position:relative;flex:none}
#ring::after{content:"";position:absolute;inset:.8cqw;border-radius:50%;background:var(--p2)}
#nx{position:absolute;bottom:1.2cqw;left:50%;transform:translateX(-50%);padding:.8cqw 4cqw;font-size:1.8cqw;font-weight:700;letter-spacing:.08em;border-radius:3cqw;background:#ff4f7b;border:.4cqw solid #c2335a;color:#fff;white-space:nowrap}
#ov{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3cqw;background:rgba(58,22,110,.86);color:#fff}
#ov h1,#ov h2{margin:1cqw 0;font-size:8cqw;line-height:1;color:#ff6b8f;-webkit-text-stroke:.9cqw #2a1252;paint-order:stroke fill;text-shadow:0 .8cqw 0 #2a1252}
#ov h2{font-size:6cqw}
#ov p{margin:.6cqw 0;max-width:62cqw;font-size:2.3cqw;line-height:1.4}
.logo{background:#fff;padding:1.2cqw 2.2cqw;border-radius:2cqw;display:inline-block}
.logo img{display:block;height:6.5cqw;width:auto}
.site{color:var(--org);font-weight:700;font-size:2.3cqw;text-decoration:none;margin:.8cqw 0}
.site:hover{text-decoration:underline}
button{margin-top:2cqw;padding:1.4cqw 6cqw;font:700 3.4cqw Fredoka,system-ui,sans-serif;color:#fff;background:var(--pink);border:0;border-bottom:.9cqw solid #c2335a;border-radius:3cqw;cursor:pointer}
button:active{transform:translateY(.4cqw);border-bottom-width:.5cqw}
.st{display:flex;gap:1.4cqw;flex-wrap:wrap;justify-content:center;margin:1.6cqw 0}
.st div{background:var(--p1);border:.4cqw solid var(--line);padding:1cqw 2.4cqw;border-radius:2cqw;font-weight:700;font-size:2.6cqw}
small.k{opacity:.75;font-size:1.9cqw;margin-top:1.4cqw}
</style>
</head>

function lolli(b,x,y,r,col){b.fillStyle='#e9e4f5';b.fillRect(x-3,y,6,190);b.fillStyle='#2a1252';circ(b,x,y,r+3);b.fillStyle=col;circ(b,x,y,r);b.strokeStyle='#fff';b.lineWidth=r*.18;b.beginPath();for(let a=0;a<14;a+=.2){const rr=r*.12+a*r*.062;b.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}b.stroke()}

let best=(()=>{try{return +localStorage.getItem('cw_best')||0}catch(e){return 0}})();
let cs=[],ps=[],sel=null,score=0,words=0,good=0,mist=0,run=false,last=0,T=0,tleft=ROUND,spawnT=0,flash=0;
const pick=a=>a[Math.random()*a.length|0];
function spawn(){
  const live=cs.map(c=>c.w),pool=WORDS.filter(w=>!live.includes(w)),firsts=cs.map(c=>c.w[0]);
  const pref=pool.filter(w=>!firsts.includes(w[0])),w=pick(pref.length?pref:pool);
  cs.push({w,lane:Math.random()*5|0,y:-CH,typed:0,col:pick(PAL),settled:false,sh:0});
}
function hud(){$('sc').textContent=score;$('bs').textContent=best}
function intro(){
  $('ov').style.display='flex';
  $('ov').innerHTML=`<a class="logo" href="${SITE}" target="_blank" rel="noopener" title="Visit Typing Games Free"><img src="${LOGO}" alt="Typing Games Free"></a>
  <a class="site" href="${SITE}" target="_blank" rel="noopener">typinggamesfree.io</a>
  <h1>Candy Word Pop</h1>
  <p><b>Pop the candy by typing the words!</b></p>
  <p>Candies fall and stack up. Type the word to pop them. Don't let the pile reach the top!</p>
  <button id="go">Play Now ▶</button><small class="k">PRESS SPACE OR ENTER</small>`;
  $('go').onclick=start;
}
function start(){cs=[];ps=[];sel=null;score=0;words=0;good=0;mist=0;tleft=ROUND;spawnT=.3;flash=0;run=true;last=performance.now();$('ov').style.display='none';hud()}
function finish(won){
  run=false;const nb=score>best;if(nb){best=score;try{localStorage.setItem('cw_best',best)}catch(e){}}
  const tot=good+mist,acc=tot?Math.round(good/tot*100):0,el=Math.max(1,ROUND-tleft),wpm=Math.round((good/5)/(el/60));hud();
  $('ov').style.display='flex';
  $('ov').innerHTML=`<h2>${won?'Sweet! You did it!':'The pile reached the top!'}</h2><p>${nb?'New best score! ':''}${won?'You kept the candy under control for the whole round.':'Try again and pop them faster.'}</p>
  <div class="st"><div>Score ${score}</div><div>Words ${words}</div><div>WPM ${wpm}</div><div>Accuracy ${acc}%</div></div>
  <button id="go">Play Again</button>
  <a class="site" href="${SITE}" target="_blank" rel="noopener">More free typing games at typinggamesfree.io →</a>
  <small class="k">PRESS SPACE OR ENTER</small>`;
  $('go').onclick=start;
}
function burst(c){const x=LANES[c.lane],y=c.y+CH/2;for(let i=0;i<16;i++){const a=rnd(0,TAU),s=rnd(80,260);ps.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-80,l:.7,col:i%2?c.col[0]:'#fff'})}ps.push({x,y,t:1,txt:'+'+c.w.length*10})}

  }else{mist++;flash=.25;if(sel){sel.typed=0;sel.sh=.3}sel=null}
});
function update(dt){
  T+=dt;tleft-=dt;flash=Math.max(0,flash-dt);spawnT-=dt;
  $('tm').textContent=Math.floor(Math.max(0,Math.ceil(tleft))/60)+':'+String(Math.max(0,Math.ceil(tleft))%60).padStart(2,'0');
  $('ring').style.setProperty('--t',Math.max(0,tleft/ROUND*100));
  if(spawnT<=0){spawn();spawnT=Math.max(2,3.3-(ROUND-tleft)*.016)}
  const v=62+(ROUND-tleft)*.5;
  for(let l=0;l<5;l++){let rest=FLOOR;
    for(const c of cs.filter(c=>c.lane===l).sort((a,b)=>b.y-a.y)){
      const tg=rest-CH;c.y=Math.min(tg,c.y+v*dt);c.settled=c.y>=tg-.5;rest=c.y;
      if(c.settled&&c.y<CEIL){finish(false);return}
    }}
  cs.forEach(c=>c.sh=Math.max(0,c.sh-dt));
  ps.forEach(p=>{if(p.txt){p.t-=dt;p.y-=40*dt}else{p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt}});ps=ps.filter(p=>(p.l??p.t)>0);
  if(tleft<=0)finish(true);
}
function candy(c){
  const x=LANES[c.lane]+(c.sh?Math.sin(T*80)*4:0),y=c.y+CH/2,[a,d]=c.col;
  ctx.fillStyle='rgba(40,10,80,.22)';ctx.beginPath();ctx.ellipse(x,c.y+CH-2,60,6,0,0,TAU);ctx.fill();
  ctx.fillStyle=d;for(const s of[-1,1]){ctx.beginPath();ctx.moveTo(x+s*50,y);ctx.lineTo(x+s*68,y-17);ctx.lineTo(x+s*68,y+17);ctx.closePath();ctx.fill()}
  ctx.fillStyle=a;ctx.beginPath();ctx.roundRect(x-54,y-23,108,46,14);ctx.fill();
  ctx.save();ctx.clip();ctx.fillStyle='rgba(255,255,255,.16)';for(let i=-54;i<54;i+=16)ctx.fillRect(x+i,y-23,8,46);ctx.restore();
  ctx.strokeStyle='#2a1252';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(x-54,y-23,108,46,14);ctx.stroke();
  if(c===sel){ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.roundRect(x-59,y-28,118,56,17);ctx.stroke()}
  ctx.fillStyle='#fff';ctx.beginPath();ctx.roundRect(x-44,y-14,88,28,9);ctx.fill();
  ctx.font='700 19px Fredoka,system-ui,sans-serif';ctx.textBaseline='middle';ctx.textAlign='left';
  const tw=ctx.measureText(c.w).width;let px=x-tw/2;
  for(let i=0;i<c.w.length;i++){ctx.fillStyle=i<c.typed?'#12a063':'#3a1f66';ctx.fillText(c.w[i],px,y+1);px+=ctx.measureText(c.w[i]).width}
}
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(run)update(dt);else T+=dt;
  ctx.clearRect(0,0,W,H);ctx.drawImage(bg,0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,.55)';ctx.setLineDash([10,8]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(20,CEIL);ctx.lineTo(W-20,CEIL);ctx.stroke();ctx.setLineDash([]);
  cs.forEach(candy);
  ps.forEach(p=>{if(p.txt){ctx.globalAlpha=Math.max(0,p.t);ctx.font='700 26px Fredoka,system-ui';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.strokeStyle='#2a1252';ctx.lineWidth=5;ctx.strokeText(p.txt,p.x,p.y);ctx.fillText(p.txt,p.x,p.y);ctx.globalAlpha=1}else{ctx.globalAlpha=Math.max(0,p.l/.7);ctx.fillStyle=p.col;circ(ctx,p.x,p.y,5);ctx.globalAlpha=1}});
  if(flash>0){ctx.fillStyle=`rgba(255,60,60,${flash*.7})`;ctx.fillRect(0,0,W,H)}
  requestAnimationFrame(loop);
}
$('bs').textContent=best;intro();requestAnimationFrame(t=>{last=t;loop(t)});
</script>
